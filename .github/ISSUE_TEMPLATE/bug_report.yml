name: Bug report
description: Something does not work as written
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: And what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Exact commands
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: OS, architecture, blaze version, commit
    validations:
      required: true
