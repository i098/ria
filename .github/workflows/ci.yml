name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --manifest-path rust/Cargo.toml --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo clippy --manifest-path rust/Cargo.toml --workspace --all-targets -- -D warnings
      - name: Check Mac host bindings
        run: cargo clippy --locked --manifest-path rust/Cargo.toml --target aarch64-apple-darwin -p ria-host-mac --all-targets -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      # The jail escape tests (crates/ria-plugin-broker/crates/jail/tests/escape.rs) need a bwrap
      # built by scripts/build-bwrap.sh (ARDIA_BWRAP) and a sandbox-capable host; only the jail unit tests run here.
      - run: cargo test --manifest-path rust/Cargo.toml --workspace --exclude ardia-plugin-jail
      - run: cargo test --manifest-path rust/Cargo.toml -p ardia-plugin-jail --lib
      # Check L of ria-engine-sys (tests/live.rs) needs macOS and the prebuilt engine; on Linux it prints "skipped".

  broker:
    name: broker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ardia-browser/ardia
          ref: 551d3c13c1c9ede130724ea9f1056d4b586fbe55
          path: ardia
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      # The host and integration crates are not workspace members; the script builds them in a temp layout.
      - run: rust/crates/ria-plugin-broker/scripts/ci-check.sh ardia

  parity:
    name: parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node rust/parity/compare.selftest.mjs
      - run: sha256sum -c SHA256SUMS
        working-directory: rust/parity/captures/states

  headers:
    name: headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rust/tools/check-headers.sh

  sentrux:
    name: sentrux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install sentrux 0.5.7
        run: |
          curl -fsSL -o sentrux https://github.com/sentrux/sentrux/releases/download/v0.5.7/sentrux-linux-x86_64
          echo "3237f80fe20d54aad4deefa8a143f0d60543bb5d2d6ad891eb42432f155725a6  sentrux" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          install -m 0755 sentrux "$HOME/.local/bin/sentrux"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # Compares with .sentrux/baseline.json; a DEGRADED verdict exits nonzero.
      - run: sentrux gate .
