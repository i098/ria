name: remote-check

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Keep the Linux checks in sync with ci.yml. This workflow does not check Mac bindings.
jobs:
  fmt:
    runs-on: [self-hosted, linux, cf-ria]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --manifest-path rust/Cargo.toml --check

  clippy:
    runs-on: [self-hosted, linux, cf-ria]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo clippy --manifest-path rust/Cargo.toml --workspace --all-targets -- -D warnings

  test:
    runs-on: [self-hosted, linux, cf-ria]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo test --manifest-path rust/Cargo.toml --workspace --exclude ardia-plugin-jail
      - run: cargo test --manifest-path rust/Cargo.toml -p ardia-plugin-jail --lib
      # Build the jail integration tests without running their sandbox-dependent cases.
      - name: Build all workspace tests
        run: cargo test --manifest-path rust/Cargo.toml --workspace --no-run

  parity:
    runs-on: [self-hosted, linux, cf-ria]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node rust/parity/compare.selftest.mjs
      - run: sha256sum -c SHA256SUMS
        working-directory: rust/parity/captures/states

  headers:
    runs-on: [self-hosted, linux, cf-ria]
    steps:
      - uses: actions/checkout@v4
      - run: rust/tools/check-headers.sh

  sentrux:
    name: sentrux
    runs-on: [self-hosted, linux, cf-ria]
    steps:
      - uses: actions/checkout@v4
      - name: Install sentrux 0.5.7
        run: |
          curl -fsSL -o sentrux https://github.com/sentrux/sentrux/releases/download/v0.5.7/sentrux-linux-x86_64
          echo "3237f80fe20d54aad4deefa8a143f0d60543bb5d2d6ad891eb42432f155725a6  sentrux" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          install -m 0755 sentrux "$HOME/.local/bin/sentrux"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # Compares with .sentrux/baseline.json; a DEGRADED verdict exits nonzero.
      - run: sentrux gate .
