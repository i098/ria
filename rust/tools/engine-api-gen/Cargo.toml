[package]
name = "engine-api-live"
version = "0.0.0"
description = "Check L of slice 3.2: the typed engine API against the prebuilt engine."
edition = "2024"
license = "Apache-2.0"
publish = false

# A package of its own (not a member of rust/), so `blaze test --test live` runs from this folder.
[workspace]

[dev-dependencies]
ria-engine = { path = "../../crates/ria-engine" }
ria-engine-sys = { path = "../../crates/ria-engine-sys" }
serde_json = "1"
libc = "0.2"

[target.'cfg(target_os = "macos")'.dev-dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = "0.3"

# It has its own `main`, because the engine owns the main thread.
[[test]]
name = "live"
harness = false
