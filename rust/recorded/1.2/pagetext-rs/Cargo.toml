[package]
name = "pagetext-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
description = "Rust port of `packages/core/src/pageText.ts`, generated by rust-anything"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
napi = "3"
napi-derive = "3"
ria-core = { version = "0.0.0", path = "../../../crates/ria-core" }
serde = "1"
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip", "unbounded_depth"] }

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true

[lints.clippy]
all = { level = "warn", priority = -1 }
# The generated wire code calls `f64::from` on an `f64` result.
useless_conversion = "allow"

[lints.rust]
unused_lifetimes = "warn"
trivial_numeric_casts = "warn"
