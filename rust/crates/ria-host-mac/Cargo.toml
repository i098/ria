[package]
name = "ria-host-mac"
version = "0.0.0"
description = "Mac host: objc2 bindings of ArdiaCore.h, the engine delegate and the host services on top of the engine."
edition.workspace = true
license.workspace = true
publish.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
serde_json = "1"
zeroize = "1"
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
ria-engine = { path = "../ria-engine" }
libc = "0.2"
ria-surface = { path = "../ria-surface" }
rune = { git = "https://github.com/anomalyco/rune", rev = "5b27303b0f5e7e100747d83f4eb7bf4925cd05f7" }

# The live checks need their own `main` because the engine owns the main thread.
[[test]]
name = "live"
path = "src/core/live.rs"
harness = false

[[test]]
name = "live_tabs"
path = "tests/live_tabs.rs"
harness = false

[[test]]
name = "live_windows"
path = "tests/live_windows.rs"
harness = false

[[test]]
name = "live_pip"
path = "tests/live_pip.rs"
harness = false

[[test]]
name = "live_swipe"
path = "tests/live_swipe.rs"
harness = false

[[test]]
name = "live_diagnostics"
path = "tests/live_diagnostics.rs"
harness = false
