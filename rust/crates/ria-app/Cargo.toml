[package]
name = "ria-app"
version = "0.0.0"
description = "Native Ria browser app."
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
probes = []

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
ria-host-mac = { path = "../ria-host-mac" }
serde_json = "1"

[[test]]
name = "live"
path = "src/launch/live.rs"
harness = false
