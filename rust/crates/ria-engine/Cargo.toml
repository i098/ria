[package]
name = "ria-engine"
version = "0.0.0"
description = "Call layer over the engine: action queue, settled cell, timeouts, private-profile and secret rules."
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.22"
fastrand = "2"
json5 = "1.3"
ria-engine-sys = { path = "../ria-engine-sys" }
rustix = { version = "1", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
unicode-segmentation = "1"
zeroize = "1"
libc = "0.2"
url = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "ico", "bmp", "webp"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "macos")'.dev-dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = "0.3"

# Check L of slice 3.3. It has its own `main`, because the engine owns the main thread.
[[test]]
name = "live"
path = "src/domains/data/live.rs"
harness = false
