[package]
name = "ria-engine"
version = "0.0.0"
description = "Call layer over the engine: action queue, settled cell, timeouts, private-profile and secret rules."
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
json5 = "0.4"
ria-engine-sys = { path = "../ria-engine-sys" }
rustix = { version = "1", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
unicode-segmentation = "1"
zeroize = "1"
