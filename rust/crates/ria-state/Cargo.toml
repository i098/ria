[package]
name = "ria-state"
version = "0.0.0"
description = "Ria state: the 41 state folders of Ardia as Rust modules, with the store kernel."
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
sha2 = "0.10"
url = "2"
unicode-normalization = "0.1"
ria-core = { path = "../ria-core" }

[lints.clippy]
all = { level = "warn", priority = -1 }

[dev-dependencies]
# The replay test keeps the key order of the recorded JSON (`Object.keys` order is `settingsMeta.chosen` order).
serde_json = { version = "1", features = ["preserve_order"] }
