[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
publish = false

[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"

# Match the patches of the pinned Rune workspace.
[patch.crates-io]
accesskit_macos = { git = "https://github.com/anomalyco/rune", rev = "5b27303b0f5e7e100747d83f4eb7bf4925cd05f7" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "5b27303b0f5e7e100747d83f4eb7bf4925cd05f7" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "5b27303b0f5e7e100747d83f4eb7bf4925cd05f7" }
sctk-adwaita = { git = "https://github.com/anomalyco/rune", rev = "5b27303b0f5e7e100747d83f4eb7bf4925cd05f7" }
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "5b27303b0f5e7e100747d83f4eb7bf4925cd05f7" }
winit = { git = "https://github.com/anomalyco/rune", rev = "5b27303b0f5e7e100747d83f4eb7bf4925cd05f7" }
